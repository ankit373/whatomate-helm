# PostgreSQL and Redis for the smoke test only. The chart does not bundle them.
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: whatomate}
            - {name: POSTGRES_PASSWORD, value: ci-password}
            - {name: POSTGRES_DB, value: whatomate}
          readinessProbe:
            exec: {command: [pg_isready, -U, whatomate]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 3
